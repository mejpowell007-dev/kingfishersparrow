                ,toolbar : ""
                ,toolbarPosition: 'top'
                ,thumbnailsPosition : 'bottom'
                ,responsiveHandleWidth : 50

            // imageBook = ["1", "8"][ Math.floor(Math.random()*2)];
            // imageBookPath = "WowBook_files/magazine_template_0"+imageBook+"/";
            // $("#book1-trigger .book-thumb").attr("src", imageBookPath+"image_000.jpg")

            var optionsBook1 = {
                 height   : 1056
                ,width    : 816*2
                // ,maxWidth : 800
                // ,maxHeight : 800
                ,pageCount : 40
                ,images : imageBookPath+"/image_{{xxx}}.jpg"

                ,lightbox : "#book1-trigger"

                ,hardcovers : true

                ,toolbar : "lastLeft, left, currentPage, right, lastRight, zoomin, zoomout, slideshow, flipsound, fullscreen, thumbnails"
                ,thumbnailsPosition : 'left'
                ,thumbnailScale: 0.12
                ,thumbnailsSprite: imageBookPath+"/thumbnails_sprite_0.12.jpg"
                ,perspective: 4000
                ,responsiveHandleWidth: 50

                ,onFullscreenError: fullscreenErrorHandler
            };

            var optionsBook2 = {
                 height   : 1024
                ,width    : 725*2
                // ,maxWidth : 800
                // ,maxHeight : 400
                ,pageNumbers: false
				,style: "wowbook-cs-white"
                ,pdf: "WowBook_files/img/dashi/Dashi_Excerpt_MEJPowell.pdf"

                ,pdfTextSelectable: true

                ,lightbox : "#book2-trigger"

            };

                ,toolbarPosition: 'top'
                ,thumbnailsPosition : 'bottom'
                ,responsiveHandleWidth : 50

                ,onFullscreenError: fullscreenErrorHandler
            };

            var books = {
               "#book999" : optionsBook999,
                "#book1" : optionsBook1,
                "#book2" : optionsBook2,
                "#book3" : optionsBook3
            };
            $("#book999-trigger, #book1-trigger, #book2-trigger, #book3-trigger").on("click",function(){
                buildBook( "#"+this.id.replace("-trigger", "") );
            })

            function buildBook( elem ){
                var book=$.wowBook(elem);
                if (!book) {
                    $(elem).wowBook( books[elem] );
                    book=$.wowBook(elem);
                }
                // book.opts.onHideLightbox = function(){

                book.showLightbox();
            }
